site_name: Bond Bridge Consulting
site_description: Bond Bridge Consulting Public Site
theme:
  name: material
  logo: img/bond-bridge-tag.svg
  favicon: img/bond-bridge-icon.svg
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - toc.integrate

nav:
  - Home: index.md
  - Services: services/index.md
  - Team: team/index.md
  - Case Studies: case-studies/index.md
  - Contact: contact-us.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  